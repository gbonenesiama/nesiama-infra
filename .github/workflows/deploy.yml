name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.24.130.130
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "Caddyfile,Dockerfile,docker-compose.yml"
          target: /opt/nesiama-infra/

      - name: Deploy Caddy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.24.130.130
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /opt/nesiama-infra
            docker compose up -d --build
            echo "Caddy deployed"
            docker compose ps
